name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Signing only engages when the secrets are present, so a fork -- which has
    # none of them -- still gets a working (ad-hoc, unnotarised) build rather
    # than a red workflow.
    - name: Check for signing credentials
      id: creds
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      run: |
        if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$APPLE_API_KEY_P8" ]; then
          echo "signed=true" >> "$GITHUB_OUTPUT"
        else
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Signing secrets absent - producing an ad-hoc build that Gatekeeper will reject."
        fi

    - name: Import signing certificate
      if: steps.creds.outputs.signed == 'true'
      env:
        MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        set -euo pipefail
        CERT_PATH="$RUNNER_TEMP/certificate.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

        echo -n "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 900 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        # Let codesign use the key without an interactive prompt.
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
        security list-keychain -d user -s "$KEYCHAIN_PATH"

        rm -f "$CERT_PATH"
        security find-identity -v -p codesigning "$KEYCHAIN_PATH"

    - name: Build screensaver
      env:
        SIGN_IDENTITY: ${{ steps.creds.outputs.signed == 'true' && secrets.MACOS_SIGNING_IDENTITY || '-' }}
      run: make build SIGN_IDENTITY="$SIGN_IDENTITY"

    - name: Verify build output
      run: make verify

    - name: Notarize and staple
      if: steps.creds.outputs.signed == 'true'
      env:
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      run: |
        set -euo pipefail
        export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
        echo -n "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY_PATH"
        trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
        make notarize

    - name: Confirm Gatekeeper acceptance
      if: steps.creds.outputs.signed == 'true'
      run: make assess

    # Runs even if a step above failed, so signing material never outlives the job.
    - name: Clean up keychain
      if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
        rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"

    # ditto preserves the bundle's signature and extended attributes; `zip` does
    # not, and would invalidate the signature we just applied.
    - name: Create ZIP archive
      run: ditto -c -k --keepParent build/LiveScreensaver.saver LiveScreensaver.saver.zip

    - name: Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Build
        files: LiveScreensaver.saver.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
